<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><title>Last Signal — Battle Royale</title>
<style>
:reset{box-sizing:border-box}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;color:#edf3e6;font-family:Inter,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{height:34px;border:1px solid rgba(255,255,255,.12);border-radius:7px;background:rgba(11,15,20,.86);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#f9cb67;box-shadow:0 0 12px #f9cb67}#zoneText{color:#b9c7c1}#bottomLeft{position:absolute;left:20px;bottom:max(18px,env(safe-area-inset-bottom));width:190px}.barLabel{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.12em;margin-bottom:5px;text-transform:uppercase}.track{height:8px;border:1px solid rgba(255,255,255,.14);background:#171d21;border-radius:3px;overflow:hidden}.fill{height:100%;width:100%;background:#d9f06b;transition:width .1s}.ammo{margin-top:10px;color:#b9c7c1;font-size:12px;font-weight:800}.ammo b{color:#fff;font-size:21px;margin-right:3px}#killFeed{position:absolute;right:18px;top:62px;text-align:right;font-size:11px;color:#dce6df}.feedLine{margin:5px 0;text-shadow:0 2px 4px #000}.feedLine span{color:#ef7e68}#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.85}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}.crossV{left:10px;top:0;width:1px;height:22px}.crossH{left:0;top:10px;width:22px;height:1px}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,rgba(39,51,45,.3),rgba(5,8,11,.94) 68%);pointer-events:auto}.panel{text-align:center;width:min(620px,calc(100% - 36px));border-top:1px solid rgba(217,240,107,.35);border-bottom:1px solid rgba(217,240,107,.15);padding:31px 20px 26px;background:linear-gradient(90deg,transparent,rgba(8,13,16,.72),transparent)}.eyebrow{color:#d9f06b;font-size:11px;font-weight:900;letter-spacing:.38em;text-transform:uppercase}.title{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(54px,10vw,94px);letter-spacing:.01em;line-height:.92;margin:16px 0 10px;text-transform:uppercase;text-shadow:0 8px 30px #000}.title em{display:block;font-style:normal;color:#d9f06b}.sub{color:#aab5b0;font-size:13px;letter-spacing:.08em;margin-bottom:24px}.stats{display:flex;justify-content:center;gap:42px;margin:18px 0 24px}.stat b{display:block;font-size:23px}.stat span{font-size:9px;color:#87948f;letter-spacing:.18em;text-transform:uppercase}button{pointer-events:auto;border:1px solid #d9f06b;background:#d9f06b;color:#11160f;height:48px;padding:0 34px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}button:active{transform:translateY(1px)}#controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));right:18px;display:none;color:#84918b;font-size:10px;text-transform:uppercase;letter-spacing:.1em;text-align:right}.touch{display:none;position:absolute;pointer-events:auto}#stick{left:18px;bottom:28px;width:120px;height:120px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(20,27,29,.28)}#knob{position:absolute;width:48px;height:48px;border-radius:50%;left:36px;top:36px;background:rgba(217,240,107,.22);border:1px solid rgba(217,240,107,.5)}#fire{right:24px;bottom:42px;width:82px;height:82px;border:1px solid rgba(239,126,104,.5);border-radius:50%;background:rgba(239,126,104,.18);color:#fff;text-align:center;line-height:82px;font-weight:900;font-size:12px}@media(pointer:coarse),(max-width:700px){#controls{display:none}.touch{display:block}#bottomLeft{left:146px;bottom:max(18px,env(safe-area-inset-bottom));width:130px}.ammo{display:none}.panel{padding-top:20px}.stats{gap:20px}#killFeed{top:52px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top"><div class="pill"><i class="dot"></i><span id="zoneText">Zone stable</span></div><div class="pill"><span id="alive">24 alive</span></div><div class="pill"><span id="kills">0 kills</span></div></div>
  <div id="crosshair"><i class="crossV"></i><i class="crossH"></i></div>
  <div id="killFeed"></div>
  <div id="bottomLeft"><div class="barLabel"><span>Armor</span><span id="hpText">100</span></div><div class="track"><div class="fill" id="hpBar"></div></div><div class="ammo"><b id="ammo">30</b> / <span id="reserve">90</span></div></div>
  <div id="controls">WASD move · mouse aim · click fire · R reload</div>
  <div id="stick" class="touch"><div id="knob"></div></div><div id="fire" class="touch">FIRE</div>
  <div id="menu"><div class="panel"><div class="eyebrow">Operation 07 · Afterdark</div><div class="title">Last <em>Signal</em></div><div class="sub" id="sub">Drop in. Gear up. Survive the collapse.</div><div class="stats"><div class="stat"><b id="bestKills">0</b><span>Eliminations</span></div><div class="stat"><b id="bestPlace">—</b><span>Best Place</span></div><div class="stat"><b id="matchTime">03:00</b><span>Zone Clock</span></div></div><button id="start">Deploy</button></div></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2;let state='menu',last=0,shake=0;
const world={w:2200,h:2200,zone:{x:1100,y:1100,r:1050,target:1050,t:0}};
let player,bullets,enemies,pickups,particles,obstacles,feed,killCount,elapsed,spawnKills;
const names=['Rook','Viper','Ghost','Mako','Kestrel','Hawk','Nova','Jinx','Atlas','Shade','Wraith','Echo','Blitz','Sable','Onyx','Flint','Cobra','Knox','Raven','Zero','Ivy','Mantis','Wolf','Drift'];
const keys={};let mouse={x:W/2,y:H/2,down:false};
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function init(){
 player={x:1100,y:1100,vx:0,vy:0,r:15,hp:100,ammo:30,reserve:90,reload:0,angle:0,fire:0,inv:0};
 bullets=[];particles=[];feed=[];killCount=0;elapsed=0;spawnKills=0;
 world.zone={x:1100,y:1100,r:1050,target:1050,t:0,stage:0,next:20};
 enemies=[];
 for(let i=0;i<23;i++){let a=Math.random()*TAU,r=260+Math.random()*700;enemies.push({x:1100+Math.cos(a)*r,y:1100+Math.sin(a)*r,vx:0,vy:0,r:14,hp:65+Math.random()*35,angle:0,fire:rand(.2,1),name:names[i],speed:65+Math.random()*28,loot:false})}
 pickups=[];obstacles=[];
 for(let i=0;i<82;i++){let x=rand(120,2080),y=rand(120,2080);if(Math.hypot(x-1100,y-1100)>930||Math.random()<.65)obstacles.push({x,y,r:rand(16,34),type:Math.random()<.7?'rock':'crate'})}
 for(let i=0;i<25;i++){let a=Math.random()*TAU,r=Math.random()*900;pickups.push({x:1100+Math.cos(a)*r,y:1100+Math.sin(a)*r,type:Math.random()<.5?'ammo':'med',r:9})}
 document.getElementById('menu').style.display='none';document.getElementById('crosshair').style.display='block';state='playing';
}
function rectScreen(x,y,camera){return{x:x-camera.x,y:y-camera.y}}
function addFeed(a,b,enemy=true){feed.unshift({a,b,enemy});if(feed.length>5)feed.pop()}
function shoot(owner){if(owner===player){if(player.ammo<=0||player.reload>0)return;player.ammo--;player.fire=.13;let a=player.angle}else{owner.fire=rand(.7,1.35);let a=owner.angle}
 let spread=owner===player?.035:rand(-.12,.12),ang=(owner===player?player.angle:owner.angle)+spread;
 bullets.push({x:owner.x+Math.cos(ang)*22,y:owner.y+Math.sin(ang)*22,vx:Math.cos(ang)*(owner===player?680:470),vy:Math.sin(ang)*(owner===player?680:470),owner,life:1.25,damage:owner===player?22:6});for(let i=0;i<3;i++)particles.push({x:owner.x,y:owner.y,vx:rand(-30,30),vy:rand(-30,30),life:.18,c:'#f8d58a'})}
function reload(){if(state==='playing'&&player.reserve>0&&player.ammo<30&&player.reload<=0){player.reload=1.35}}
function circleRect(cx,cy,r,o){let x=clamp(cx,o.x-o.r,o.x+o.r),y=clamp(cy,o.y-o.r,o.y+o.r);return Math.hypot(cx-x,cy-y)<r}
function update(dt){
 if(state==='playing') elapsed+=dt;
 if(state!=='playing')return;
 player.fire-=dt;player.reload-=dt;if(player.reload<0){if(player.reload>-0.1&&player.ammo<30){let n=Math.min(30-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n}player.reload=-1};player.inv-=dt;
 let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(touchMove.active){mx=touchMove.x;my=touchMove.y}
 let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}player.vx+=(mx*210-player.vx)*Math.min(1,dt*10);player.vy+=(my*210-player.vy)*Math.min(1,dt*10);
 let nx=clamp(player.x+player.vx*dt,25,world.w-25),ny=clamp(player.y+player.vy*dt,25,world.h-25);if(!obstacles.some(o=>circleRect(nx,player.y,player.r,o)))player.x=nx;if(!obstacles.some(o=>circleRect(player.x,ny,player.r,o)))player.y=ny;
 let camera={x:clamp(player.x-W/2,0,world.w-W),y:clamp(player.y-H/2,0,world.h-H)};
 mouse.wx=player.x+(mouse.x-W/2);mouse.wy=player.y+(mouse.y-H/2);player.angle=Math.atan2(mouse.wy-player.y,mouse.wx-player.x);
 if(mouse.down&&player.fire<=0)shoot(player);if(keys.r)reload();
 world.zone.t+=dt;
 if(world.zone.t>world.zone.next&&world.zone.stage<5){world.zone.stage++;world.zone.next+=40;world.zone.target=Math.max(180,world.zone.target*.78);world.zone.t=0}
 let dr=(world.zone.target-world.zone.r)*dt*.022;if(Math.abs(dr)<.5)world.zone.r=world.zone.target;else world.zone.r+=dr;
 if(Math.hypot(player.x-world.zone.x,player.y-world.zone.y)>world.zone.r&&player.inv<=0){player.hp-=8*dt;player.inv=.1}
 for(let p of pickups){if(dist(p,player)<22){if(p.type==='ammo'){player.reserve=Math.min(150,player.reserve+30);addFeed('Supply','+30 ammo',false)}else player.hp=Math.min(100,player.hp+35);p.dead=true}}
 pickups=pickups.filter(p=>!p.dead);
 for(let e of enemies){e.fire-=dt;if(Math.hypot(e.x-world.zone.x,e.y-world.zone.y)>world.zone.r-20){let a=Math.atan2(world.zone.y-e.y,world.zone.x-e.x);e.vx+=Math.cos(a)*100*dt;e.vy+=Math.sin(a)*100*dt}else{let d=dist(e,player);if(d<520){e.angle=Math.atan2(player.y-e.y,player.x-e.x);let ideal=d>300?1:d<150?-1:0;e.vx+=Math.cos(e.angle)*e.speed*ideal*dt;e.vy+=Math.sin(e.angle)*e.speed*ideal*dt;if(d<430&&e.fire<=0&&Math.random()<.62)shoot(e)}else{e.angle+=Math.sin(elapsed*.7+e.name.length)*dt*.8;e.vx+=Math.cos(e.angle)*35*dt;e.vy+=Math.sin(e.angle)*35*dt}}e.vx*=Math.pow(.05,dt);e.vy*=Math.pow(.05,dt);let ex=e.x+e.vx*dt,ey=e.y+e.vy*dt;if(!obstacles.some(o=>circleRect(ex,e.y,e.r,o)))e.x=clamp(ex,20,world.w-20);if(!obstacles.some(o=>circleRect(e.x,ey,e.r,o)))e.y=clamp(ey,20,world.h-20);if(Math.hypot(e.x-world.zone.x,e.y-world.zone.y)>world.zone.r)e.hp-=5*dt}
 enemies=enemies.filter(e=>e.hp>0);
 for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.owner===player){for(let e of enemies){if(dist(b,e)<e.r+b.r){e.hp-=b.damage;b.dead=true;if(e.hp<=0){killCount++;spawnKills++;b.owner.dead=true;addFeed('You','eliminated '+e.name);particles.push({x:e.x,y:e.y,vx:0,vy:0,life:.01,c:'#ef7e68',burst:18})}}}}else if(dist(b,player)<b.r+player.r){player.hp-=b.damage;b.dead=true;shake=5}if(b.x<0||b.y<0||b.x>world.w||b.y>world.h)b.dead=true;if(obstacles.some(o=>Math.hypot(b.x-o.x,b.y-o.y)<o.r))b.dead=true}
 bullets=bullets.filter(b=>b.life>0&&!b.dead);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.burst){for(let i=0;i<p.burst;i++)particles.push({x:p.x,y:p.y,vx:rand(-130,130),vy:rand(-130,130),life:rand(.3,.7),c:'#ef7e68'});p.burst=0}}
 particles=particles.filter(p=>p.life>0);
 shake*=Math.pow(.08,dt);if(player.hp<=0)end(false);if(enemies.length===0)end(true);
 document.getElementById('hpBar').style.width=clamp(player.hp,0,100)+'%';document.getElementById('hpText').textContent=Math.ceil(player.hp);document.getElementById('ammo').textContent=player.ammo;document.getElementById('reserve').textContent=player.reserve;document.getElementById('alive').textContent=(enemies.length+1)+' alive';document.getElementById('kills').textContent=killCount+' kills';document.getElementById('zoneText').textContent=world.zone.r-world.zone.target<20?'Zone closing':'Zone stable';
}
function end(win){state='ended';let place=win?1:enemies.length+1;let best=Number(localStorage.lastPlace||999);if(place<best)localStorage.lastPlace=place;localStorage.lastKills=Math.max(Number(localStorage.lastKills||0),killCount);document.getElementById('bestKills').textContent=localStorage.lastKills||0;document.getElementById('bestPlace').textContent=localStorage.lastPlace&&localStorage.lastPlace<999?'#'+localStorage.lastPlace:'—';document.getElementById('sub').textContent=win?'You are the last signal.':'Eliminated · '+place+' remaining';document.querySelector('.title').innerHTML=win?'Final <em>Survivor</em>':'Mission <em>Failed</em>';document.getElementById('start').textContent='Re-deploy';document.getElementById('menu').style.display='flex';document.getElementById('crosshair').style.display='none'}
function draw(){
 let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake,camera={x:clamp(player?.x-W/2||0,0,Math.max(0,world.w-W))+sx,y:clamp(player?.y-H/2||0,0,Math.max(0,world.h-H))+sy};
 ctx.fillStyle='#11191a';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);
 ctx.fillStyle='#1a2422';ctx.fillRect(0,0,world.w,world.h);
 ctx.strokeStyle='rgba(155,174,160,.055)';ctx.lineWidth=1;for(let x=0;x<world.w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 ctx.fillStyle='rgba(217,240,107,.025)';for(let i=0;i<18;i++){ctx.beginPath();ctx.arc((i*313)%2200,(i*547)%2200,90+i*9,0,TAU);ctx.fill()}
 ctx.strokeStyle='rgba(239,126,104,.55)';ctx.lineWidth=3;ctx.setLineDash([12,10]);ctx.beginPath();ctx.arc(world.zone.x,world.zone.y,world.zone.r,0,TAU);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.rect(0,0,world.w,world.h);ctx.arc(world.zone.x,world.zone.y,world.zone.r,0,TAU,true);ctx.fill('evenodd');
 for(let o of obstacles){ctx.fillStyle=o.type==='rock'?'#424b45':'#596158';ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(o.x-o.r*.25,o.y-o.r*.28,o.r*.35,0,TAU);ctx.fill()}
 for(let p of pickups){ctx.fillStyle=p.type==='ammo'?'#d9f06b':'#78bea7';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(elapsed*2);ctx.fillRect(-7,-7,14,14);ctx.restore();ctx.fillStyle='#fff';ctx.fillRect(p.x-2,p.y-2,4,4)}
 for(let b of bullets){ctx.strokeStyle=b.owner===player?'#edf4ca':'#ef8d78';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x-b.vx*.018,b.y-b.vy*.018);ctx.lineTo(b.x,b.y);ctx.stroke()}
 for(let e of enemies){ctx.fillStyle='#bd9a73';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill();ctx.strokeStyle='#30261e';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#e9dbc5';ctx.beginPath();ctx.arc(e.x+Math.cos(e.angle)*7,e.y+Math.sin(e.angle)*7,5,0,TAU);ctx.fill();ctx.fillStyle='#5d4d3d';ctx.fillRect(e.x-14,e.y-20,28,3);ctx.fillStyle='#ef7e68';ctx.fillRect(e.x-14,e.y-20,28*clamp(e.hp/100,0,1),3);ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='700 9px Arial';ctx.textAlign='center';ctx.fillText(e.name,e.x,e.y-25)}
 if(player&&player.hp>0){ctx.fillStyle='#d9f06b';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,TAU);ctx.fill();ctx.strokeStyle='#f1f7d7';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#171d19';ctx.beginPath();ctx.arc(player.x+Math.cos(player.angle)*7,player.y+Math.sin(player.angle)*7,5,0,TAU);ctx.fill();ctx.strokeStyle='#dce8b3';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.x+Math.cos(player.angle)*8,player.y+Math.sin(player.angle)*8);ctx.lineTo(player.x+Math.cos(player.angle)*28,player.y+Math.sin(player.angle)*28);ctx.stroke()}
 for(let p of particles){ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.c||'#f8d58a';ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='menu'||state==='ended'){if(player)update(dt)}else update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
let touchMove={active:false,x:0,y:0,id:null},touchAim={active:false,x:0,y:0,id:null};
const stick=document.getElementById('stick'),knob=document.getElementById('knob');stick.addEventListener('pointerdown',e=>{touchMove.active=true;touchMove.id=e.pointerId;stick.setPointerCapture(e.pointerId)});stick.addEventListener('pointermove',e=>{if(!touchMove.active||e.pointerId!==touchMove.id)return;let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),max=42;if(m>max){x=x/m*max;y=y/m*max}touchMove.x=x/max;touchMove.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`});function endMove(){touchMove.active=false;touchMove.x=0;touchMove.y=0;knob.style.transform='';}stick.addEventListener('pointerup',endMove);stick.addEventListener('pointercancel',endMove);
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touchAim.active=true;touchAim.id=e.pointerId;mouse.x=e.clientX;mouse.y=e.clientY}});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&touchAim.active){mouse.x=e.clientX;mouse.y=e.clientY}});
const fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();mouse.down=true;fire.setPointerCapture(e.pointerId)});fire.addEventListener('pointerup',()=>mouse.down=false);fire.addEventListener('pointercancel',()=>mouse.down=false);
document.getElementById('start').addEventListener('click',()=>{init();document.querySelector('.title').innerHTML='Last <em>Signal</em>'});document.getElementById('bestKills').textContent=localStorage.lastKills||0;document.getElementById('bestPlace').textContent=localStorage.lastPlace&&localStorage.lastPlace<999?'#'+localStorage.lastPlace:'—';
player={x:1100,y:1100,vx:0,vy:0,r:15,hp:100,ammo:30,reserve:90,reload:0,angle:0,fire:0,inv:0};obstacles=[];bullets=[];enemies=[];pickups=[];particles=[];requestAnimationFrame(loop);
</script></body></html>
